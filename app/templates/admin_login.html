{% extends "base.html" %}

{% block title %}Вход для организаторов{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card card-shadow">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">🔐 Вход в панель организатора</h4>
            </div>
            <div class="card-body">
                
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                
                <form method="POST" action="/admin/login">
                    <div class="mb-3">
                        <label class="form-label">Логин</label>
                        <input type="text" class="form-control" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Войти в панель</button>
                </form>
            </div>
        </div>
        <div class="text-center mt-3">
            <small class="text-muted">Доступ только для организаторов мероприятия</small>
        </div>
    </div>
</div>
{% endblock %}
